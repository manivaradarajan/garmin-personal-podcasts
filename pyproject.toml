[project]
name = "garmin-personal-podcasts"
version = "0.1.0"
description = "Google Drive to Vercel Blob sync with a private podcast RSS feed for Garmin/PlayRun"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.3.2",
    "fastapi>=0.115.5",
    "google-api-python-client>=2.155.0",
    "google-auth>=2.37.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.4",
    "mutagen>=1.48.1",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.32.1",
    "vercel-blob>=0.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
