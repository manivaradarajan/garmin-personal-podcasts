<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Garmin Podcasts{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
    }
    nav {
      background: #1a1a2e;
      color: #fff;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }
    nav .brand { font-size: 1.1rem; font-weight: 700; letter-spacing: .5px; }
    nav .nav-right { display: flex; align-items: center; gap: 1rem; font-size: .9rem; }
    nav a { color: #a8b2d8; text-decoration: none; }
    nav a:hover { color: #fff; }
    .container { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #333; }
    .btn {
      display: inline-block;
      padding: .45rem 1rem;
      border-radius: 5px;
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
    }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-primary:hover { background: #4338ca; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }
    .flash {
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
      color: #065f46;
      padding: .75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: .9rem;
    }
    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>
  <nav>
    <span class="brand">🎙 Garmin Podcasts</span>
    <div class="nav-right">
      {% if email is defined %}
        <span>{{ email }}</span>
        <a href="/auth/logout">Sign out</a>
      {% endif %}
    </div>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
